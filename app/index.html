<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KeepSight</title>
<style>
  :root {
    --background:#ffffff; --background-soft:#f7f7f9; --sidebar-background:rgba(244,244,247,.72);
    --text:#1d1d1f; --text-secondary:#48484a; --text-muted:#8e8e93;
    --border:rgba(0,0,0,.08); --hover:rgba(0,0,0,.045); --chip:rgba(0,0,0,.055);
    --accent:#5b5bf7; --accent-soft:rgba(91,91,247,.12); --accent-text:#fff;
    --danger:#e5484d; --shadow:0 18px 50px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.08);
    --radius:10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background:#1e1e21; --background-soft:#232327; --sidebar-background:rgba(28,28,31,.6);
      --text:#f5f5f7; --text-secondary:#c7c7cc; --text-muted:#8e8e93;
      --border:rgba(255,255,255,.08); --hover:rgba(255,255,255,.055); --chip:rgba(255,255,255,.08);
      --accent:#7c7cff; --accent-soft:rgba(124,124,255,.2);
      --shadow:0 18px 50px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.3);
    }
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html { background:transparent; }
  body {
    margin:0; height:100vh; display:grid; grid-template-columns:220px 340px 1fr; overflow:hidden;
    font:13px/1.4 -apple-system, "SF Pro Text", Inter, "Segoe UI", sans-serif; color:var(--text);
    background:transparent; -webkit-font-smoothing:antialiased;
  }
  svg.icon { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }
  kbd { font:11px/1 -apple-system, sans-serif; padding:2px 5px; border-radius:4px; background:var(--chip); color:var(--text-muted); }
  button { font:inherit; color:inherit; }
  .window-drag { -webkit-app-region:drag; }
  .window-drag :is(button, input, a) { -webkit-app-region:no-drag; }

  /* ---- Sidebar (vibrancy shows what's behind the window) ---- */
  aside { background:var(--sidebar-background); border-right:1px solid var(--border); overflow:auto; padding:48px 10px 12px; display:flex; flex-direction:column; }
  aside.collapsed { padding:0; border:0; overflow:hidden; }
  aside h3 { margin:16px 8px 4px; font-size:11px; font-weight:600; color:var(--text-muted); letter-spacing:.02em; }
  .nav-row { display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:7px; cursor:default; color:var(--text-secondary); }
  .nav-row:hover { background:var(--hover); }
  .nav-row.selected { background:var(--accent-soft); color:var(--accent); }
  .nav-row .label { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav-row .count { font-size:11px; color:var(--text-muted); font-variant-numeric:tabular-nums; }
  .nav-row.selected .count { color:inherit; }
  #tag-chips { display:flex; flex-wrap:wrap; gap:4px; padding:2px 6px; }
  .chip { display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:20px; background:var(--chip); color:var(--text-secondary); font-size:11.5px; cursor:default; }
  .chip:hover { filter:brightness(.97); }
  .chip.selected { background:var(--accent); color:var(--accent-text); }
  .tag-dot { width:7px; height:7px; border-radius:50%; flex:none; }
  .sidebar-footer { margin-top:auto; padding:12px 8px 0; color:var(--text-muted); font-size:11.5px; display:flex; align-items:center; gap:6px; cursor:default; }
  .sidebar-footer:hover { color:var(--text-secondary); }

  /* ---- List ---- */
  #list-pane { background:var(--background-soft); border-right:1px solid var(--border); display:flex; flex-direction:column; min-width:0; }
  #list-header { padding:10px 12px 8px; display:flex; align-items:center; gap:8px; height:52px; }
  body.sidebar-hidden #list-header { padding-left:84px; } /* with the sidebar collapsed, leave room for the traffic-light buttons */
  .search-box { flex:1; display:flex; align-items:center; gap:6px; padding:0 8px; height:30px; border-radius:8px; background:var(--chip); color:var(--text-muted); }
  .search-box:focus-within { box-shadow:0 0 0 3px var(--accent-soft); background:var(--background); }
  #search-input { flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--text); font:inherit; }
  #list-heading { padding:2px 16px 8px; font-size:11px; font-weight:600; color:var(--text-muted); display:flex; align-items:center; gap:6px; min-height:26px; }
  #list-scope { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tag-filter { display:inline-flex; align-items:center; gap:3px; padding:1px 3px 1px 8px; border-radius:20px; background:var(--accent-soft); color:var(--accent); }
  .tag-filter button { display:grid; place-items:center; width:16px; height:16px; padding:0; border:0; border-radius:50%; background:none; color:inherit; cursor:default; }
  .tag-filter button:hover { background:var(--accent); color:var(--accent-text); }
  .tag-filter svg.icon { width:11px; height:11px; }
  #item-list { flex:1; overflow:auto; padding:0 8px 12px; }
  .item { display:flex; gap:10px; padding:9px 10px; border-radius:var(--radius); cursor:default; margin-bottom:2px; }
  .item:hover { background:var(--hover); }
  .item.opened { background:var(--hover); }
  .item.selected { background:var(--accent-soft); }
  .item-icon { width:28px; height:28px; border-radius:7px; display:grid; place-items:center; background:var(--chip); color:var(--text-secondary); flex:none; }
  .item.selected .item-icon { background:var(--accent); color:var(--accent-text); }
  .item-body { min-width:0; flex:1; }
  .item-title { font-weight:550; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item-meta { color:var(--text-muted); font-size:11.5px; margin-top:1px; display:flex; gap:6px; align-items:center; overflow:hidden; white-space:nowrap; }
  .item-tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; }
  .tag-pill { display:inline-flex; align-items:center; gap:4px; height:18px; padding:0 7px; border-radius:9px; background:var(--chip); color:var(--text-secondary); font-size:11px; cursor:default; }
  .tag-pill .tag-dot { width:6px; height:6px; }
  .tag-pill:hover { background:var(--accent-soft); color:var(--accent); }
  .tag-pill.selected { background:var(--accent); color:var(--accent-text); }
  .item-snippet { color:var(--text-secondary); font-size:11.5px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item-snippet mark { background:var(--accent-soft); color:var(--accent); border-radius:3px; padding:0 1px; }
  .empty-message { padding:40px 16px; text-align:center; color:var(--text-muted); }

  /* ---- Preview ---- */
  main { background:var(--background); display:flex; flex-direction:column; min-width:0; }
  #toolbar { display:flex; gap:2px; padding:0 10px; height:52px; border-bottom:1px solid var(--border); align-items:center; }
  .current-item { flex:1; min-width:0; padding:0 8px; display:flex; flex-direction:column; justify-content:center; }
  #current-title { font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #current-path { color:var(--text-muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .toolbar-separator { width:1px; height:18px; background:var(--border); margin:0 6px; }
  .toolbar-button { display:grid; place-items:center; width:30px; height:28px; border:0; border-radius:7px; background:none; color:var(--text-secondary); cursor:default; }
  .toolbar-button:hover:not(:disabled) { background:var(--hover); color:var(--text); }
  .toolbar-button:disabled { opacity:.35; }
  .toolbar-button.pressed { background:var(--accent-soft); color:var(--accent); }
  .toolbar-button.danger:hover:not(:disabled) { color:var(--danger); }
  #stage { flex:1; display:flex; min-height:0; }
  #panes { flex:1; display:grid; gap:1px; background:var(--border); min-height:0; min-width:0; position:relative; }
  .pane { display:flex; flex-direction:column; background:var(--background); min-width:0; min-height:0; outline:2px solid transparent; outline-offset:-2px; }
  #panes.split .pane.active { outline-color:var(--accent); }
  .pane-header { display:flex; align-items:center; gap:4px; padding:0 6px 0 12px; height:30px; font-size:12px; color:var(--text-muted); border-bottom:1px solid var(--border); }
  #panes:not(.split) .pane-header:not(.has-controls) { display:none; } /* with a single pane, show the header only when it has controls */
  .pane-label { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pane-header button { height:22px; padding:0 6px; border:0; border-radius:5px; background:none; color:var(--text-muted); font-size:11px; display:flex; align-items:center; gap:3px; cursor:default; }
  .pane-header button:hover { background:var(--hover); color:var(--text); }
  .pane-header button.pressed { color:var(--accent); }
  .pane-header svg.icon { width:13px; height:13px; }
  .version-label { color:var(--accent); font-weight:600; }
  .pane webview { flex:1; background:#fff; }
  .empty-state { flex:1; display:flex; flex-direction:column; gap:14px; align-items:center; justify-content:center; color:var(--text-muted); text-align:center; }
  .empty-logo { width:56px; height:56px; border-radius:14px; display:grid; place-items:center; color:#fff; background:linear-gradient(135deg, #5b5bf7, #8b5cf6); box-shadow:0 8px 24px rgba(91,91,247,.35); }
  .empty-logo svg.icon { width:28px; height:28px; }
  .empty-state h2 { margin:0; font-size:15px; font-weight:600; color:var(--text); }
  .shortcut-list { display:grid; grid-template-columns:auto auto; gap:6px 14px; font-size:12px; text-align:left; }

  /* ---- Version history panel ---- */
  #history-panel { width:280px; border-left:1px solid var(--border); background:var(--background-soft); display:flex; flex-direction:column; }
  #history-panel header { display:flex; align-items:center; padding:10px 8px 6px 14px; font-weight:600; }
  #history-panel header span { flex:1; }
  #history-panel p { margin:0 14px 8px; color:var(--text-muted); font-size:11.5px; }
  #version-list { flex:1; overflow:auto; padding:0 8px 12px; }
  .version-row { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; cursor:default; }
  .version-row:hover { background:var(--hover); }
  .version-row.selected { background:var(--accent-soft); }
  .version-details { flex:1; min-width:0; }
  .version-age { font-weight:550; }
  .version-info { font-size:11px; color:var(--text-muted); }
  .latest-badge { font-size:10px; font-weight:600; color:var(--accent); background:var(--accent-soft); padding:1px 6px; border-radius:10px; }
  .version-row button { border:0; border-radius:6px; padding:3px 8px; background:var(--chip); color:var(--text-secondary); font-size:11px; cursor:default; }
  .version-row button:hover { background:var(--accent); color:var(--accent-text); }

  /* ---- Resize handles. While dragging, stop webviews from swallowing the mouse ---- */
  .column-resizer { position:fixed; top:0; bottom:0; width:6px; margin-left:-3px; cursor:col-resize; z-index:5; }
  .pane-resizer { position:absolute; z-index:5; }
  .pane-resizer.vertical { top:0; bottom:0; width:6px; margin-left:-3px; cursor:col-resize; }
  .pane-resizer.horizontal { left:0; right:0; height:6px; margin-top:-3px; cursor:row-resize; }
  .column-resizer:hover, .pane-resizer:hover { background:var(--accent); opacity:.35; }
  body.dragging { user-select:none; }
  body.dragging webview { pointer-events:none; }

  /* Zen mode (fill screen) and mini window: keep only the preview content (hide pane headers and borders too) */
  body:is(.zen-mode, .mini-window) { grid-template-columns:1fr !important; }
  body:is(.zen-mode, .mini-window) :is(aside, #list-pane, #toolbar, .column-resizer, .pane-header, #history-panel) { display:none !important; }
  body:is(.zen-mode, .mini-window) .pane { outline:0; }

  /* ---- Dialogs ---- */
  dialog { border:1px solid var(--border); border-radius:14px; background:var(--background); color:var(--text); box-shadow:var(--shadow); padding:0; }
  dialog::backdrop { background:rgba(0,0,0,.18); backdrop-filter:blur(2px); }
  dialog.form-dialog { width:420px; }
  dialog.form-dialog form { padding:18px 20px; }
  dialog.form-dialog h2 { margin:0 0 6px; font-size:15px; }
  dialog label { display:block; margin:12px 0 4px; font-size:12px; color:var(--text-muted); }
  dialog input { width:100%; padding:7px 9px; border:1px solid var(--border); border-radius:7px; background:var(--background-soft); color:var(--text); font:inherit; outline:0; }
  dialog input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  dialog menu { display:flex; justify-content:flex-end; gap:8px; padding:0; margin:18px 0 0; }
  dialog menu button { padding:6px 14px; border:1px solid var(--border); border-radius:7px; background:var(--background-soft); cursor:default; }
  dialog menu button[value=ok] { background:var(--accent); color:var(--accent-text); border-color:transparent; }

  /* ---- Quick open (⌘K) ---- */
  #palette { width:620px; margin-top:14vh; overflow:hidden; }
  .palette-search { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border); color:var(--text-muted); }
  .palette-search svg.icon { width:18px; height:18px; }
  #palette #palette-input { flex:1; border:0; outline:0; box-shadow:none; background:transparent; color:var(--text); font:17px -apple-system, sans-serif; padding:0; }
  #palette-results { max-height:360px; overflow:auto; padding:6px; }
  .palette-row { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; cursor:default; }
  .palette-row.selected { background:var(--accent); color:var(--accent-text); }
  .palette-row .item-icon { width:26px; height:26px; border-radius:6px; color:inherit; }
  .palette-row.selected .item-icon { background:rgba(255,255,255,.2); }
  .palette-title { flex:1; min-width:0; font-weight:550; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .palette-folder { font-size:11.5px; color:var(--text-muted); }
  .palette-row.selected .palette-folder { color:rgba(255,255,255,.75); }
  #palette footer { display:flex; gap:16px; padding:8px 16px; border-top:1px solid var(--border); color:var(--text-muted); font-size:11.5px; background:var(--background-soft); }
</style>
</head>
<body>
<!-- Icon sprite: use as <svg class="icon"><use href="#icon-name"/></svg> -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="icon-sidebar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
  <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>

  <symbol id="icon-columns" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></symbol>
  <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="icon-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l2 2M14 9l2 2"/></symbol>
  <symbol id="icon-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></symbol>
  <symbol id="icon-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M10 13l-2 2 2 2M14 13l2 2-2 2"/></symbol>

  <symbol id="icon-recent" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v4h4M12 8v4l3 2"/></symbol>

  <symbol id="icon-command" viewBox="0 0 24 24"><path d="M9 6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3z"/></symbol>
</svg>

<aside class="window-drag">
  <h3>Library</h3><div id="library-rows"></div>
  <h3>Folders</h3><div id="folder-rows"></div>
  <h3>Tags</h3><div id="tag-chips"></div>
  <div class="sidebar-footer" id="palette-hint"><svg class="icon"><use href="#icon-command"/></svg>Quick open <kbd>⌘K</kbd></div>
</aside>
<section id="list-pane">
  <div id="list-header" class="window-drag">
    <label class="search-box"><svg class="icon"><use href="#icon-search"/></svg><input id="search-input" placeholder="Search titles, tags, content" spellcheck="false"><kbd>/</kbd></label>
  </div>
  <div id="list-heading"><span id="list-scope">All artifacts</span><span id="tag-filter"></span><span id="list-count"></span></div>
  <div id="item-list"></div>
</section>
<main>
  <div id="toolbar" class="window-drag">
    <button class="toolbar-button" id="sidebar-button" title="Toggle sidebar (⌘B)"><svg class="icon"><use href="#icon-sidebar"/></svg></button>
    <div class="current-item"><span id="current-title"></span><span id="current-path"></span></div>
    <button class="toolbar-button" data-action="open" disabled title="Open in browser (↵)"><svg class="icon"><use href="#icon-external"/></svg></button>
    <button class="toolbar-button" data-action="editor" disabled title="Open in editor"><svg class="icon"><use href="#icon-code"/></svg></button>
    <button class="toolbar-button" data-action="reveal" disabled title="Reveal in Finder"><svg class="icon"><use href="#icon-folder"/></svg></button>
    <button class="toolbar-button" data-action="edit" disabled title="Edit title, tags, folder (⌘E)"><svg class="icon"><use href="#icon-pencil"/></svg></button>
    <button class="toolbar-button" id="history-button" disabled title="Version history (⌘Y)"><svg class="icon"><use href="#icon-clock"/></svg></button>
    <button class="toolbar-button danger" data-action="trash" disabled title="Move to Trash (⌘⌫)"><svg class="icon"><use href="#icon-trash"/></svg></button>
    <span class="toolbar-separator"></span>
    <button class="toolbar-button" id="split-button" title="Split pane (⌘\)"><svg class="icon"><use href="#icon-columns"/></svg></button>
    <button class="toolbar-button" id="zen-button" title="Zen mode (⌘.)"><svg class="icon"><use href="#icon-zen"/></svg></button>
    <button class="toolbar-button" id="mini-button" title="Floating mini window (⌘⇧.)"><svg class="icon"><use href="#icon-mini"/></svg></button>
    <span class="toolbar-separator"></span>
    <button class="toolbar-button" id="chrome-login-button" title="Import claude.ai login from Chrome"><svg class="icon"><use href="#icon-key"/></svg></button>
    <button class="toolbar-button" id="add-link-button" title="Add link"><svg class="icon"><use href="#icon-plus"/></svg></button>
  </div>
  <div id="stage">
    <div id="panes">
      <div class="pane-resizer vertical" id="pane-resizer-vertical" title="Double-click to reset"></div>
      <div class="pane-resizer horizontal" id="pane-resizer-horizontal" title="Double-click to reset"></div>
    </div>
    <section id="history-panel" hidden>
      <header><span>Version history</span><button class="toolbar-button" id="history-close-button" title="Close"><svg class="icon"><use href="#icon-close"/></svg></button></header>
      <p>Every save is kept automatically. Click a version to compare it side by side.</p>
      <div id="version-list"></div>
    </section>
  </div>
</main>
<div class="column-resizer" id="sidebar-resizer" title="Double-click to reset"></div>
<div class="column-resizer" id="list-resizer" title="Double-click to reset"></div>

<datalist id="folder-suggestions"></datalist>

<dialog id="add-link-dialog" class="form-dialog">
  <form method="dialog">
    <h2>Add link</h2>
    <label>URL (https)</label><input name="url" required pattern="https://.*" placeholder="https://claude.ai/artifact/…">
    <label>Title</label><input name="title" required>
    <label>Folder</label><input name="folder" list="folder-suggestions" placeholder="e.g. work/db">
    <label>Tags</label><input name="tags" placeholder="comma separated">
    <menu><button value="cancel" formnovalidate>Cancel</button><button value="ok">Add</button></menu>
  </form>
</dialog>

<dialog id="edit-dialog" class="form-dialog">
  <form method="dialog">
    <h2>Edit</h2>
    <label>Title</label><input name="title">
    <label>Tags</label><input name="tags" placeholder="comma separated">
    <label>Folder (empty = root; changing it moves the file)</label><input name="folder" list="folder-suggestions">
    <menu><button value="cancel" formnovalidate>Cancel</button><button value="ok">Save</button></menu>
  </form>
</dialog>

<dialog id="palette">
  <div class="palette-search"><svg class="icon"><use href="#icon-search"/></svg><input id="palette-input" placeholder="Open an artifact…" autocomplete="off" spellcheck="false"></div>
  <div id="palette-results"></div>
  <footer><span><kbd>↵</kbd> open</span><span><kbd>⌘↵</kbd> open in new pane</span><span><kbd>esc</kbd> close</span></footer>
</dialog>

<script>
/** @typedef {import('./store').Item} Item */
/** @typedef {import('./store').Version} Version */
/** @typedef {Item & { versionTime?: number }} ShownItem an item, or a saved version of it when `versionTime` is set */
/**
 * One preview pane.
 * @typedef {object} Pane
 * @property {ShownItem | null} item displayed item
 * @property {string | null} source webview URL
 * @property {number} zoom zoom factor (1 = 100%)
 * @property {number} [loadedAt] time of the last completed load (ms). Basis for auto-refresh
 * @property {HTMLElement} element
 * @property {HTMLElement} header
 * @property {HTMLElement} label
 * @property {HTMLElement} zoomButton
 * @property {HTMLElement} refreshButton
 * @property {HTMLElement} emptyState
 * @property {Electron.WebviewTag} webview
 */
/**
 * Where a search query matched inside an item's body text.
 * @typedef {object} Snippet
 * @property {string} before text right before the match
 * @property {string} match the matched text
 * @property {string} after text right after the match
 */

const MAX_PANES = 4;
const RECENT_FOLDER = '\0recent'; // marker for "Recently opened" that can't collide with a folder name
const MAX_RECENT_ITEMS = 20;
const REFRESH_INTERVALS_MINUTES = [0, 1, 5, 15, 30]; // 0 = off
const DEFAULT_LAYOUT = { sidebarWidth: 220, listWidth: 340, columnSplitPercent: 50, rowSplitPercent: 50, sidebarVisible: true };

/**
 * @param {string} selector
 * @returns {HTMLElement}
 */
const queryOne = selector => document.querySelector(selector);

/**
 * Reads a JSON setting from localStorage. Returns the fallback if missing or blocked.
 * @template T
 * @param {string} key
 * @param {T} fallback
 * @returns {T}
 */
function readSetting(key, fallback) {
  try {
    return JSON.parse(localStorage.getItem(key)) ?? fallback;
  } catch {
    return fallback;
  }
}

/**
 * Writes a JSON setting to localStorage. Failures are ignored, since settings are only conveniences.
 * @param {string} key
 * @param {unknown} value
 */
function writeSetting(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch {}
}

/** @type {Item[]} */
let items = [];
/** @type {Item[]} items shown in the list after filtering */
let visibleItems = [];
/** @type {string | null} null = all, {@link RECENT_FOLDER} = recently opened, otherwise a folder */
let selectedFolder = null;
/** @type {string | null} */
let selectedTag = null;
/** @type {Pane[]} */
const panes = [];
let activePaneIndex = 0;
// Recent items, refresh intervals, and layout are viewer conveniences, so they live in localStorage
/** @type {string[]} paths, most recent first */
let recentPaths = readSetting('recent', []);
/** @type {Record<string, number>} auto-refresh interval in minutes per link path */
const refreshMinutesByPath = readSetting('refresh', {});
const layout = { ...DEFAULT_LAYOUT, ...readSetting('layout', {}) };

/**
 * @param {number} value
 * @param {number} minimum
 * @param {number} maximum
 * @returns {number}
 */
const clamp = (value, minimum, maximum) => Math.min(maximum, Math.max(minimum, value));

/**
 * @param {Item | null | undefined} item
 * @returns {boolean} true for `.url` bookmarks
 */
const isLink = item => item?.kind === 'link';

/** @returns {boolean} */
const isZenMode = () => document.body.classList.contains('zen-mode');

/** @returns {boolean} */
const isMiniWindow = () => document.body.classList.contains('mini-window');

/**
 * @returns {ShownItem | null} item shown in the active pane
 */
const activeItem = () => panes[activePaneIndex]?.item || null;

/**
 * Rank of each recently opened path (0 = most recent).
 * @returns {Map<string, number>}
 */
const recentRanks = () => new Map(recentPaths.map((recentPath, rank) => [recentPath, rank]));

// ---- Element helpers ----

/**
 * Creates an element. Strings read from files always go in through textContent.
 * @param {string} tagName
 * @param {string | null} [className]
 * @param {unknown} [text]
 * @returns {HTMLElement}
 */
function makeElement(tagName, className, text) {
  const element = document.createElement(tagName);
  if (className) element.className = className;
  if (text != null) element.textContent = text;
  return element;
}

/**
 * Creates a sprite icon.
 * @param {string} name symbol name without the `icon-` prefix
 * @returns {SVGSVGElement}
 */
function makeIcon(name) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'icon');
  const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  use.setAttribute('href', '#icon-' + name);
  svg.append(use);
  return svg;
}

/**
 * Icon box for an item (link or file).
 * @param {Item} item
 * @returns {HTMLElement}
 */
function makeItemIcon(item) {
  const box = makeElement('div', 'item-icon');
  box.append(makeIcon(isLink(item) ? 'link' : 'file'));
  return box;
}

/**
 * A color dot that stays the same for a tag everywhere. The hue comes from a hash of the name.
 * @param {string} tag
 * @returns {HTMLElement}
 */
function makeTagDot(tag) {
  let hue = 0;
  for (const character of tag) hue = (hue * 31 + character.codePointAt(0)) % 360;
  const dot = makeElement('span', 'tag-dot');
  dot.style.background = `hsl(${hue} 65% 55%)`;
  return dot;
}

const relativeTimeFormat = new Intl.RelativeTimeFormat('en', { numeric: 'auto' });

/**
 * Relative time like "3 minutes ago". Shows a date after a week.
 * @param {number} time (ms)
 * @returns {string}
 */
function formatRelativeTime(time) {
  const seconds = (time - Date.now()) / 1000;
  if (Math.abs(seconds) >= 7 * 86400) return new Date(time).toLocaleDateString();
  for (const [unit, unitSeconds] of [['day', 86400], ['hour', 3600], ['minute', 60]]) {
    if (Math.abs(seconds) >= unitSeconds) return relativeTimeFormat.format(Math.round(seconds / unitSeconds), unit);
  }
  return 'just now';
}

// ---- Layout and resizing ----

/**
 * Applies `layout` to the window and saves it.
 */
function applyLayout() {
  const sidebarWidth = layout.sidebarVisible ? layout.sidebarWidth : 0;
  document.body.style.gridTemplateColumns = `${sidebarWidth}px ${layout.listWidth}px 1fr`;
  queryOne('aside').classList.toggle('collapsed', !layout.sidebarVisible);
  document.body.classList.toggle('sidebar-hidden', !layout.sidebarVisible);
  queryOne('#sidebar-button').classList.toggle('pressed', !layout.sidebarVisible);
  queryOne('#sidebar-resizer').hidden = !layout.sidebarVisible;
  queryOne('#sidebar-resizer').style.left = sidebarWidth + 'px';
  queryOne('#list-resizer').style.left = sidebarWidth + layout.listWidth + 'px';
  layoutPanes();
  writeSetting('layout', layout);
}

/**
 * Lets a handle resize something by dragging, and reset it by double-clicking.
 * @param {HTMLElement} handle
 * @param {(mouseEvent: MouseEvent) => void} onDrag updates `layout`
 * @param {() => void} onReset
 */
function makeResizable(handle, onDrag, onReset) {
  handle.addEventListener('mousedown', downEvent => {
    downEvent.preventDefault();
    document.body.classList.add('dragging');
    const move = moveEvent => {
      onDrag(moveEvent);
      applyLayout();
    };
    const stop = () => {
      document.body.classList.remove('dragging');
      removeEventListener('mousemove', move);
      removeEventListener('mouseup', stop);
    };
    addEventListener('mousemove', move);
    addEventListener('mouseup', stop);
  });
  handle.addEventListener('dblclick', () => {
    onReset();
    applyLayout();
  });
}

/** @returns {DOMRect} */
const panesBounds = () => queryOne('#panes').getBoundingClientRect();

makeResizable(queryOne('#sidebar-resizer'),
  mouseEvent => { layout.sidebarWidth = clamp(mouseEvent.clientX, 160, 400); },
  () => { layout.sidebarWidth = DEFAULT_LAYOUT.sidebarWidth; });
makeResizable(queryOne('#list-resizer'),
  mouseEvent => { layout.listWidth = clamp(mouseEvent.clientX - (layout.sidebarVisible ? layout.sidebarWidth : 0), 240, 700); },
  () => { layout.listWidth = DEFAULT_LAYOUT.listWidth; });
makeResizable(queryOne('#pane-resizer-vertical'),
  mouseEvent => { const bounds = panesBounds(); layout.columnSplitPercent = clamp((mouseEvent.clientX - bounds.left) / bounds.width * 100, 15, 85); },
  () => { layout.columnSplitPercent = DEFAULT_LAYOUT.columnSplitPercent; });
makeResizable(queryOne('#pane-resizer-horizontal'),
  mouseEvent => { const bounds = panesBounds(); layout.rowSplitPercent = clamp((mouseEvent.clientY - bounds.top) / bounds.height * 100, 15, 85); },
  () => { layout.rowSplitPercent = DEFAULT_LAYOUT.rowSplitPercent; });

/**
 * Collapses or expands the sidebar (⌘B).
 */
function toggleSidebar() {
  layout.sidebarVisible = !layout.sidebarVisible;
  applyLayout();
}

/**
 * Toggles zen mode: full screen, preview only (⌘.). Ignored in the mini window.
 */
function toggleZen() {
  if (isMiniWindow()) return;
  window.api.setFullScreen(document.body.classList.toggle('zen-mode'));
  layoutPanes();
}

/**
 * Toggles the mini window: small, in a corner, always on top (⌘⇧.). Remembers where it was for next time.
 * @returns {Promise<void>}
 */
async function toggleMini() {
  if (isZenMode()) toggleZen();
  const enabled = document.body.classList.toggle('mini-window');
  const miniBounds = await window.api.setMiniWindow(enabled, readSetting('miniBounds', null));
  if (miniBounds) writeSetting('miniBounds', miniBounds);
  layoutPanes();
}

// ---- Panes ----

/**
 * Adds a pane and makes it active (up to {@link MAX_PANES}, ⌘\).
 */
function addPane() {
  if (panes.length >= MAX_PANES) return;
  /** @type {Pane} */
  const pane = { item: null, source: null, zoom: 1, element: makeElement('div', 'pane') };

  pane.header = makeElement('div', 'pane-header');
  pane.label = makeElement('span', 'pane-label', 'Empty');
  pane.zoomButton = makeElement('button');
  pane.zoomButton.title = 'Reset zoom (⌘0)';
  pane.zoomButton.hidden = true;
  pane.zoomButton.onclick = clickEvent => {
    clickEvent.stopPropagation();
    pane.zoom = 1;
    applyPaneZoom(pane);
  };
  pane.refreshButton = makeElement('button');
  pane.refreshButton.title = 'Auto-refresh interval (click to change)';
  pane.refreshButton.onclick = clickEvent => {
    clickEvent.stopPropagation();
    cycleRefreshInterval(pane.item.path);
  };
  const closeButton = makeElement('button');
  closeButton.append(makeIcon('close'));
  closeButton.title = 'Close pane';
  closeButton.onclick = clickEvent => {
    clickEvent.stopPropagation();
    closePane(panes.indexOf(pane));
  };
  pane.header.append(pane.label, pane.refreshButton, pane.zoomButton, closeButton);

  pane.emptyState = makeElement('div', 'empty-state');
  const logo = makeElement('div', 'empty-logo');
  logo.append(makeIcon('layers'));
  const shortcuts = makeElement('div', 'shortcut-list');
  for (const [keys, action] of [['⌘K', 'Quick open'], ['⌘\\', 'Split pane'], ['⌘.', 'Zen mode'], ['⌘⇧.', 'Floating mini window']]) {
    shortcuts.append(makeElement('kbd', null, keys), makeElement('span', null, action));
  }
  pane.emptyState.append(logo, makeElement('h2', null, 'Select an artifact'), shortcuts);

  pane.webview = document.createElement('webview');
  pane.webview.setAttribute('partition', 'persist:claude'); // keeps the claude.ai login
  pane.webview.setAttribute('allowpopups', ''); // SSO popups. main.js setWindowOpenHandler decides which are allowed
  pane.webview.hidden = true;
  pane.webview.addEventListener('focus', () => setActivePane(panes.indexOf(pane)));
  pane.webview.addEventListener('dom-ready', () => applyPaneZoom(pane));
  pane.webview.addEventListener('did-finish-load', () => { pane.loadedAt = Date.now(); });

  pane.element.append(pane.header, pane.emptyState, pane.webview);
  pane.element.addEventListener('mousedown', () => setActivePane(panes.indexOf(pane)));
  panes.push(pane);
  queryOne('#panes').append(pane.element);
  setActivePane(panes.length - 1);
}

/**
 * Closes a pane. The last pane is only cleared.
 * @param {number} index
 */
function closePane(index) {
  if (panes.length === 1) {
    showInPane(panes[0], null);
    syncWithActivePane();
    return;
  }
  panes[index].element.remove();
  panes.splice(index, 1);
  setActivePane(Math.min(activePaneIndex, panes.length - 1));
}

/**
 * @param {number} index pane to activate
 */
function setActivePane(index) {
  activePaneIndex = index;
  panes.forEach((pane, paneIndex) => pane.element.classList.toggle('active', paneIndex === index));
  syncWithActivePane();
}

/**
 * Shows an item in a pane. Does not reload if the URL is unchanged.
 * @param {Pane} pane
 * @param {ShownItem | null} item null clears the pane
 */
function showInPane(pane, item) {
  pane.item = item;
  // encodeURI leaves ? and # as-is, which truncates names like "what?.html", so each path segment is encoded instead
  const source = item && (isLink(item) ? item.url : 'file://' + item.path.split('/').map(encodeURIComponent).join('/'));
  if (source && source !== pane.source) pane.webview.src = source;
  pane.source = source;
  pane.webview.hidden = !item;
  pane.emptyState.hidden = !!item;
  pane.label.replaceChildren();
  if (item?.versionTime) pane.label.append(makeElement('span', 'version-label', formatRelativeTime(item.versionTime) + ' · '));
  pane.label.append(item ? item.title : 'Empty');
  updatePaneControls(pane);
}

/**
 * Syncs the pane header controls. Local files reload on their own when modified, so the refresh button shows only for links.
 * @param {Pane} pane
 */
function updatePaneControls(pane) {
  const refreshMinutes = pane.item && refreshMinutesByPath[pane.item.path];
  pane.refreshButton.hidden = !isLink(pane.item);
  pane.refreshButton.replaceChildren(makeIcon('refresh'), refreshMinutes ? `${refreshMinutes} min` : 'Off');
  pane.refreshButton.classList.toggle('pressed', !!refreshMinutes);
  pane.zoomButton.hidden = pane.zoom === 1;
  pane.zoomButton.textContent = Math.round(pane.zoom * 100) + '%';
  pane.header.classList.toggle('has-controls', !pane.refreshButton.hidden || !pane.zoomButton.hidden || !!pane.item?.versionTime);
}

/**
 * Moves a link to the next auto-refresh interval: off → 1 → 5 → 15 → 30 minutes → off.
 * @param {string} linkPath
 */
function cycleRefreshInterval(linkPath) {
  const current = refreshMinutesByPath[linkPath] || 0;
  const next = REFRESH_INTERVALS_MINUTES[(REFRESH_INTERVALS_MINUTES.indexOf(current) + 1) % REFRESH_INTERVALS_MINUTES.length];
  if (next) refreshMinutesByPath[linkPath] = next;
  else delete refreshMinutesByPath[linkPath];
  writeSetting('refresh', refreshMinutesByPath);
  panes.forEach(updatePaneControls);
}

// ponytail: checks every 30 seconds, so a refresh can run up to 30 seconds late
setInterval(() => {
  for (const pane of panes) {
    const refreshMinutes = isLink(pane.item) && refreshMinutesByPath[pane.item.path];
    if (!refreshMinutes || !pane.loadedAt || Date.now() - pane.loadedAt < refreshMinutes * 60_000) continue;
    pane.loadedAt = Date.now();
    try { pane.webview.reload(); } catch {}
  }
}, 30_000);

/**
 * Per-pane zoom. Webview zoom is independent per pane but resets to 1 on navigation, so it is reapplied on every dom-ready.
 * (CSS zoom doesn't work on claude.ai pages, so it isn't used)
 * @param {Pane} pane
 */
function applyPaneZoom(pane) {
  updatePaneControls(pane);
  if (!pane.source) return;
  try { pane.webview.setZoomFactor(pane.zoom); } catch {} // if not loaded yet, dom-ready applies it
}

/**
 * Zooms the active pane in or out.
 * @param {-1 | 0 | 1} direction 0 resets to 100%
 */
function zoomActivePane(direction) {
  const pane = panes[activePaneIndex];
  if (!pane) return;
  pane.zoom = direction === 0 ? 1 : clamp(Math.round((pane.zoom + direction * 0.1) * 10) / 10, 0.3, 2);
  applyPaneZoom(pane);
}

/**
 * Lays out the split grid and its resize handles from the pane count and `layout`.
 */
function layoutPanes() {
  const paneCount = panes.length;
  const panesElement = queryOne('#panes');
  panesElement.style.gridTemplateColumns = paneCount === 1 ? '1fr' : `${layout.columnSplitPercent}fr ${100 - layout.columnSplitPercent}fr`;
  panesElement.style.gridTemplateRows = paneCount <= 2 ? '1fr' : `${layout.rowSplitPercent}fr ${100 - layout.rowSplitPercent}fr`;
  panesElement.classList.toggle('split', paneCount > 1);
  queryOne('#pane-resizer-vertical').hidden = paneCount < 2;
  queryOne('#pane-resizer-horizontal').hidden = paneCount <= 2;
  queryOne('#pane-resizer-vertical').style.left = layout.columnSplitPercent + '%';
  queryOne('#pane-resizer-horizontal').style.top = layout.rowSplitPercent + '%';
  queryOne('#split-button').disabled = paneCount >= MAX_PANES;
  queryOne('#zen-button').classList.toggle('pressed', isZenMode());
}

/**
 * When pane state changes, syncs the toolbar, layout, list highlight, and version panel.
 */
function syncWithActivePane() {
  const item = activeItem();
  document.querySelectorAll('[data-action]').forEach(button => { button.disabled = !item || !!item.versionTime; });
  queryOne('#history-button').disabled = item?.kind !== 'file';
  queryOne('#current-title').textContent = item ? item.title : 'KeepSight';
  queryOne('#current-path').textContent = item ? (item.url || item.path) : `${items.length} artifacts`;
  layoutPanes();
  renderLibrary();
  if (!queryOne('#history-panel').hidden && item && !item.versionTime) renderVersionList();
}

// ---- Library and list ----

/**
 * Reloads the library. Refreshes any pane whose open file was modified.
 * @returns {Promise<void>}
 */
async function loadLibrary() {
  const previousModifiedAt = new Map(items.map(item => [item.path, item.modifiedAt]));
  ({ items } = await window.api.scan());
  const itemsByPath = new Map(items.map(item => [item.path, item]));
  for (const pane of panes) {
    if (!pane.item || pane.item.versionTime) continue; // version previews aren't in the library, so leave them alone
    const updated = itemsByPath.get(pane.item.path);
    // Refresh the pane if the file changed (useful while Claude Code is rewriting it)
    const fileChanged = updated && updated.kind === 'file' && updated.modifiedAt !== previousModifiedAt.get(updated.path);
    if (fileChanged && pane.source) { try { pane.webview.reloadIgnoringCache(); } catch {} }
    showInPane(pane, updated || null);
  }
  syncWithActivePane();
}

/**
 * One sidebar row.
 * @param {string} iconName
 * @param {string} label
 * @param {number} count
 * @param {boolean} selected
 * @param {() => void} onSelect
 * @returns {HTMLElement}
 */
function makeNavigationRow(iconName, label, count, selected, onSelect) {
  const row = makeElement('div', 'nav-row' + (selected ? ' selected' : ''));
  row.append(makeIcon(iconName), makeElement('span', 'label', label), makeElement('span', 'count', count));
  row.onclick = onSelect;
  return row;
}

/**
 * @param {Item} item
 * @param {Map<string, number>} ranks from {@link recentRanks}
 * @returns {boolean} true if the item belongs to the selected folder (or to "Recently opened")
 */
function isInSelectedFolder(item, ranks) {
  if (selectedFolder === null) return true;
  if (selectedFolder === RECENT_FOLDER) return ranks.has(item.path);
  return item.folder === selectedFolder || item.folder.startsWith(selectedFolder + '/');
}

/**
 * Finds the query in an item's body text.
 * @param {Item} item
 * @param {string} query lowercase
 * @returns {Snippet | null}
 */
function findSnippet(item, query) {
  const matchStart = item.searchText.toLowerCase().indexOf(query);
  if (matchStart < 0) return null;
  const matchEnd = matchStart + query.length;
  return {
    before: item.searchText.slice(Math.max(0, matchStart - 16), matchStart),
    match: item.searchText.slice(matchStart, matchEnd),
    after: item.searchText.slice(matchEnd, matchEnd + 60),
  };
}

/**
 * Selects a folder in the sidebar, or clears it when it is already selected.
 * @param {string | null} folder
 */
function selectFolder(folder) {
  selectedFolder = selectedFolder === folder ? null : folder;
  renderLibrary();
}

/**
 * Changes the tag filter. null clears it.
 * @param {string | null} tag
 */
function setTagFilter(tag) {
  selectedTag = tag;
  renderLibrary();
}

/**
 * Redraws the sidebar and the list with the current filters (folder, tag, query).
 */
function renderLibrary() {
  const query = queryOne('#search-input').value.trim().toLowerCase();
  const ranks = recentRanks();

  const countsByFolder = {};
  for (const item of items) countsByFolder[item.folder] = (countsByFolder[item.folder] || 0) + 1;
  queryOne('#library-rows').replaceChildren(
    makeNavigationRow('layers', 'All artifacts', items.length, selectedFolder === null, () => selectFolder(null)),
    makeNavigationRow('recent', 'Recently opened', items.filter(item => ranks.has(item.path)).length, selectedFolder === RECENT_FOLDER, () => selectFolder(RECENT_FOLDER)),
  );
  queryOne('#folder-rows').replaceChildren(...Object.entries(countsByFolder).sort().map(([folder, count]) =>
    makeNavigationRow('folder', folder || '(root)', count, selectedFolder === folder, () => selectFolder(folder))));
  queryOne('#folder-suggestions').replaceChildren(...Object.keys(countsByFolder).filter(Boolean).sort()
    .map(folder => Object.assign(makeElement('option'), { value: folder })));

  const tagChips = queryOne('#tag-chips');
  tagChips.replaceChildren();
  for (const tag of [...new Set(items.filter(item => isInSelectedFolder(item, ranks)).flatMap(item => item.tags))].sort()) {
    const chip = makeElement('span', 'chip' + (selectedTag === tag ? ' selected' : ''));
    chip.append(makeTagDot(tag), tag);
    chip.onclick = () => setTagFilter(selectedTag === tag ? null : tag);
    tagChips.append(chip);
  }

  // If the title, name, folder, and tags don't match, search the body text too. Body matches show surrounding context
  /** @type {Map<string, Snippet>} */
  const snippetsByPath = new Map();
  visibleItems = items.filter(item => {
    if (!isInSelectedFolder(item, ranks) || (selectedTag && !item.tags.includes(selectedTag))) return false;
    if (!query || [item.title, item.name, item.folder, ...item.tags].join(' ').toLowerCase().includes(query)) return true;
    const snippet = findSnippet(item, query);
    if (snippet) snippetsByPath.set(item.path, snippet);
    return !!snippet;
  });
  if (selectedFolder === RECENT_FOLDER) visibleItems.sort((a, b) => ranks.get(a.path) - ranks.get(b.path));

  queryOne('#list-scope').textContent = selectedFolder === null ? 'All artifacts' : selectedFolder === RECENT_FOLDER ? 'Recently opened' : selectedFolder || '(root)';
  renderTagFilter();
  queryOne('#list-count').textContent = visibleItems.length;

  const openPaths = new Set(panes.map(pane => pane.item?.path));
  const itemList = queryOne('#item-list');
  itemList.replaceChildren();
  if (!visibleItems.length) itemList.append(makeElement('div', 'empty-message', items.length ? 'No matches' : 'Drop HTML files into ~/artifacts to get started'));
  for (const item of visibleItems) itemList.append(makeItemRow(item, openPaths, snippetsByPath.get(item.path)));
  queryOne('.item.selected')?.scrollIntoView({ block: 'nearest' });
}

/**
 * While filtering by tag, shows which tag above the list, with × to clear it.
 */
function renderTagFilter() {
  const container = queryOne('#tag-filter');
  container.replaceChildren();
  if (!selectedTag) return;
  const filter = makeElement('span', 'tag-filter');
  const clearButton = makeElement('button');
  clearButton.title = 'Clear tag filter (esc)';
  clearButton.append(makeIcon('close'));
  clearButton.onclick = () => setTagFilter(null);
  filter.append(makeTagDot(selectedTag), '#' + selectedTag, clearButton);
  container.append(filter);
}

/**
 * One list row: icon, title, folder and age, tag pills, and the search snippet when the body matched.
 * @param {Item} item
 * @param {Set<string>} openPaths paths shown in any pane
 * @param {Snippet} [snippet]
 * @returns {HTMLElement}
 */
function makeItemRow(item, openPaths, snippet) {
  const state = activeItem()?.path === item.path ? ' selected' : openPaths.has(item.path) ? ' opened' : '';
  const row = makeElement('div', 'item' + state);
  const body = makeElement('div', 'item-body');
  body.append(makeElement('div', 'item-title', item.title));
  const meta = makeElement('div', 'item-meta');
  meta.append(makeElement('span', null, item.folder || '(root)'), '·', makeElement('span', null, formatRelativeTime(item.modifiedAt)));
  body.append(meta);
  // Clicking a tag in a row also filters by it (click again to clear)
  if (item.tags.length) {
    const tagPills = makeElement('div', 'item-tags');
    for (const tag of item.tags) {
      const pill = makeElement('span', 'tag-pill' + (selectedTag === tag ? ' selected' : ''));
      pill.append(makeTagDot(tag), tag);
      pill.onclick = clickEvent => {
        clickEvent.stopPropagation();
        setTagFilter(selectedTag === tag ? null : tag);
      };
      tagPills.append(pill);
    }
    body.append(tagPills);
  }
  if (snippet) {
    const snippetElement = makeElement('div', 'item-snippet');
    snippetElement.append('…' + snippet.before, makeElement('mark', null, snippet.match), snippet.after + '…');
    body.append(snippetElement);
  }
  row.append(makeItemIcon(item), body);
  row.onclick = () => openItem(item);
  row.oncontextmenu = async menuEvent => {
    menuEvent.preventDefault();
    await openItem(item);
    const action = await window.api.showContextMenu();
    if (action) runAction(action);
  };
  return row;
}

/**
 * Opens an item in the active pane and adds it to the recent items. For claude.ai links, checks the login first.
 * @param {Item | null} item
 * @returns {Promise<void>}
 */
async function openItem(item) {
  // Show the preview even if the login check fails. The Chrome login button shows the reason
  if (isLink(item) && /^https:\/\/claude\.ai\//.test(item.url)) {
    try { await window.api.ensureClaudeLogin(); } catch {}
  }
  showInPane(panes[activePaneIndex], item);
  if (item) {
    recentPaths = [item.path, ...recentPaths.filter(recentPath => recentPath !== item.path)].slice(0, MAX_RECENT_ITEMS);
    writeSetting('recent', recentPaths);
  }
  syncWithActivePane();
}

// ---- Quick open (⌘K) ----

/**
 * One quick open result.
 * @typedef {object} PaletteResult
 * @property {Item} item
 * @property {number} score higher ranks first
 */

/** @type {Item[]} */
let paletteResults = [];
let paletteSelection = 0;

/**
 * Quick open score: high for a contiguous match, low for an in-order subsequence match, with a bonus for recent items.
 * @param {Item} item
 * @param {string} query lowercase
 * @param {Map<string, number>} ranks from {@link recentRanks}
 * @returns {number} 0 means the item does not match
 */
function paletteScore(item, query, ranks) {
  const recentBonus = ranks.has(item.path) ? (MAX_RECENT_ITEMS - ranks.get(item.path)) * 2 : 0;
  if (!query) return 1 + recentBonus;
  const searchable = `${item.title} ${item.folder} ${item.tags.join(' ')}`.toLowerCase();
  const matchStart = searchable.indexOf(query);
  if (matchStart >= 0) return 100 - Math.min(matchStart, 50) + recentBonus;
  let matchedCharacters = 0;
  for (const character of searchable) if (character === query[matchedCharacters]) matchedCharacters++;
  return matchedCharacters === query.length ? 10 + recentBonus : 0;
}

/**
 * Redraws the quick open results.
 */
function renderPalette() {
  const query = queryOne('#palette-input').value.trim().toLowerCase();
  const ranks = recentRanks();
  /** @type {PaletteResult[]} */
  const scored = items.map(item => ({ item, score: paletteScore(item, query, ranks) })).filter(result => result.score > 0);
  scored.sort((a, b) => b.score - a.score || b.item.modifiedAt - a.item.modifiedAt);
  paletteResults = scored.slice(0, 50).map(result => result.item);
  paletteSelection = clamp(paletteSelection, 0, Math.max(0, paletteResults.length - 1));

  const container = queryOne('#palette-results');
  container.replaceChildren();
  if (!paletteResults.length) container.append(makeElement('div', 'empty-message', 'No matches'));
  paletteResults.forEach((item, index) => {
    const row = makeElement('div', 'palette-row' + (index === paletteSelection ? ' selected' : ''));
    row.append(makeItemIcon(item), makeElement('span', 'palette-title', item.title), makeElement('span', 'palette-folder', item.folder || '(root)'));
    row.onmousemove = () => {
      if (paletteSelection === index) return;
      paletteSelection = index;
      renderPalette();
    };
    row.onclick = clickEvent => openPaletteSelection(clickEvent.metaKey);
    container.append(row);
  });
  container.querySelector('.palette-row.selected')?.scrollIntoView({ block: 'nearest' });
}

/**
 * Shows quick open (⌘K, or ⌥⌘K from anywhere). From the mini window, returns to the normal window first.
 * @returns {Promise<void>}
 */
async function openPalette() {
  if (isMiniWindow()) await toggleMini();
  if (queryOne('#palette').open) return queryOne('#palette-input').select();
  document.querySelectorAll('dialog[open]').forEach(dialog => dialog.close());
  queryOne('#palette-input').value = '';
  paletteSelection = 0;
  renderPalette();
  queryOne('#palette').showModal();
  queryOne('#palette-input').focus();
}

/**
 * Opens the selected quick open result.
 * @param {boolean} inNewPane true opens it in a new pane
 */
function openPaletteSelection(inNewPane) {
  const item = paletteResults[paletteSelection];
  if (!item) return;
  queryOne('#palette').close();
  if (inNewPane) addPane();
  openItem(item);
}

queryOne('#palette-input').oninput = () => {
  paletteSelection = 0;
  renderPalette();
};
queryOne('#palette-input').onkeydown = keyEvent => {
  if (keyEvent.key === 'ArrowDown' || keyEvent.key === 'ArrowUp') {
    keyEvent.preventDefault();
    paletteSelection += keyEvent.key === 'ArrowDown' ? 1 : -1;
    renderPalette();
  }
  if (keyEvent.key === 'Enter') {
    keyEvent.preventDefault();
    openPaletteSelection(keyEvent.metaKey);
  }
};
// Clicking outside the palette (on the backdrop) closes it
queryOne('#palette').onclick = clickEvent => { if (clickEvent.target === queryOne('#palette')) queryOne('#palette').close(); };
queryOne('#palette-hint').onclick = openPalette;

// ---- Version history ----

/**
 * Opens or closes the version panel (⌘Y). Files only.
 */
function toggleHistoryPanel() {
  const opening = queryOne('#history-panel').hidden && activeItem()?.kind === 'file';
  queryOne('#history-panel').hidden = !opening;
  queryOne('#history-button').classList.toggle('pressed', opening);
  if (opening) renderVersionList();
}

/**
 * Renders the versions of the active pane's file. Clicking a version shows it in the next pane for comparison; Restore reverts to it.
 * @returns {Promise<void>}
 */
async function renderVersionList() {
  const item = activeItem();
  if (item?.kind !== 'file') return;
  /** @type {Version[]} */
  const versions = await window.api.listVersions(item.path);
  const shownVersionPaths = new Set(panes.filter(pane => pane.item?.versionTime).map(pane => pane.item.path));
  const container = queryOne('#version-list');
  container.replaceChildren();
  if (!versions.length) container.append(makeElement('div', 'empty-message', 'No versions yet'));
  versions.forEach((version, index) => {
    const row = makeElement('div', 'version-row' + (shownVersionPaths.has(version.path) ? ' selected' : ''));
    const details = makeElement('div', 'version-details');
    details.append(
      makeElement('div', 'version-age', formatRelativeTime(version.time)),
      makeElement('div', 'version-info', `${new Date(version.time).toLocaleString()} · ${(version.size / 1024).toFixed(1)} KB`),
    );
    row.append(details);
    if (index === 0) row.append(makeElement('span', 'latest-badge', 'Latest'));
    else row.append(makeRestoreButton(item, version));
    row.onclick = () => compareVersion(item, version);
    container.append(row);
  });
}

/**
 * @param {Item} item
 * @param {Version} version
 * @returns {HTMLElement} a button that restores the item to the version after confirming
 */
function makeRestoreButton(item, version) {
  const button = makeElement('button', null, 'Restore');
  button.onclick = async clickEvent => {
    clickEvent.stopPropagation();
    const savedAt = new Date(version.time).toLocaleString();
    if (!confirm(`Restore "${item.title}" to the version from ${savedAt}?\nThe current content is kept as a new version.`)) return;
    try {
      await window.api.restoreVersion(item.path, version.path);
    } catch (error) {
      alert(error.message);
    }
  };
  return button;
}

/**
 * Shows a version in the pane next to the current file. Creates a comparison pane if there is none.
 * @param {Item} item current file
 * @param {Version} version
 */
function compareVersion(item, version) {
  const homeIndex = activePaneIndex;
  let targetIndex = panes.findIndex((pane, index) => index !== homeIndex && (pane.item?.versionTime || !pane.item));
  if (targetIndex < 0) {
    if (panes.length >= MAX_PANES) {
      targetIndex = panes.findIndex((_pane, index) => index !== homeIndex);
    } else {
      addPane();
      targetIndex = panes.length - 1;
    }
  }
  showInPane(panes[targetIndex], { ...item, path: version.path, versionTime: version.time });
  setActivePane(homeIndex);
}

queryOne('#history-button').onclick = toggleHistoryPanel;
queryOne('#history-close-button').onclick = toggleHistoryPanel;

// ---- Actions ----

/**
 * Runs a toolbar or context menu action on the active item.
 * @param {'open' | 'editor' | 'reveal' | 'edit' | 'trash'} action
 * @returns {Promise<void>}
 */
async function runAction(action) {
  const item = activeItem();
  if (!item || item.versionTime) return;
  if (action === 'edit') return openEditDialog(item);
  if (action === 'trash' && !confirm(`Move "${item.title}" to the Trash?`)) return;
  try {
    await window.api[action](item.path);
  } catch (error) {
    alert(error.message);
  }
}

/**
 * Opens the edit dialog filled with the item's values.
 * @param {Item} item
 */
function openEditDialog(item) {
  const form = queryOne('#edit-dialog form');
  form.title.value = item.title === item.name ? '' : item.title;
  form.tags.value = item.tags.join(', ');
  form.folder.value = item.folder;
  queryOne('#edit-dialog').showModal();
}

queryOne('#edit-dialog').onclose = async () => {
  const item = activeItem();
  if (queryOne('#edit-dialog').returnValue !== 'ok' || !item) return;
  const changes = Object.fromEntries(new FormData(queryOne('#edit-dialog form')));
  try {
    const newPath = await window.api.updateMeta(item.path, changes);
    // After a move, update the path in every pane showing the file so loadLibrary() doesn't miss it
    for (const pane of panes) if (pane.item?.path === item.path) pane.item = { ...pane.item, path: newPath };
    recentPaths = recentPaths.map(recentPath => recentPath === item.path ? newPath : recentPath);
    writeSetting('recent', recentPaths);
    if (refreshMinutesByPath[item.path]) {
      refreshMinutesByPath[newPath] = refreshMinutesByPath[item.path];
      delete refreshMinutesByPath[item.path];
      writeSetting('refresh', refreshMinutesByPath);
    }
    await loadLibrary();
  } catch (error) {
    alert(error.message);
  }
};

/**
 * Imports the claude.ai login from Chrome and reloads link panes.
 * @returns {Promise<void>}
 */
async function importChromeLogin() {
  try {
    const result = await window.api.importChromeLogin();
    const profile = [result.profile.name, result.profile.email].filter(Boolean).join(' · ');
    const failures = result.failed.length ? `\n${result.failed.length} failed:\n${result.failed.join('\n')}` : '';
    alert(`Imported ${result.imported} claude.ai cookies from Chrome profile (${profile}).${failures}`);
    for (const pane of panes) if (isLink(pane.item)) pane.webview.reload();
  } catch (error) {
    alert(error.message);
  }
}

document.querySelectorAll('[data-action]').forEach(button => { button.onclick = () => runAction(button.dataset.action); });
queryOne('#search-input').oninput = renderLibrary;
queryOne('#split-button').onclick = addPane;
queryOne('#zen-button').onclick = toggleZen;
queryOne('#mini-button').onclick = toggleMini;
queryOne('#chrome-login-button').onclick = importChromeLogin;
queryOne('#sidebar-button').onclick = toggleSidebar;

queryOne('#add-link-button').onclick = () => {
  const form = queryOne('#add-link-dialog form');
  form.reset();
  form.folder.value = selectedFolder && selectedFolder !== RECENT_FOLDER ? selectedFolder : '';
  queryOne('#add-link-dialog').showModal();
};
queryOne('#add-link-dialog').onclose = async () => {
  if (queryOne('#add-link-dialog').returnValue !== 'ok') return;
  const link = Object.fromEntries(new FormData(queryOne('#add-link-dialog form')));
  try {
    await window.api.addLink(link);
  } catch (error) {
    alert(error.message);
  }
};

/**
 * Moves the list selection up or down and opens that item.
 * @param {-1 | 1} step
 */
function moveListSelection(step) {
  const currentIndex = visibleItems.findIndex(item => item.path === activeItem()?.path);
  const next = visibleItems[clamp(currentIndex + step, 0, visibleItems.length - 1)];
  if (next) openItem(next);
}

document.addEventListener('keydown', keyEvent => {
  if (queryOne('dialog[open]')) return;
  const inSearch = document.activeElement === queryOne('#search-input');
  const withCommand = keyEvent.metaKey;
  if (keyEvent.key === 'Escape' && isZenMode()) return toggleZen();
  if (keyEvent.key === 'Escape' && inSearch) return queryOne('#search-input').blur();
  if (keyEvent.key === 'Escape' && selectedTag) return setTagFilter(null);

  const commandShortcuts = {
    k: openPalette,
    '\\': addPane,
    b: toggleSidebar,
    e: () => runAction('edit'),
    y: toggleHistoryPanel,
  };
  // ⌘⌫ moves to the Trash, except inside the search box where it keeps its usual text editing meaning
  if (withCommand && keyEvent.key === 'Backspace' && !inSearch && activeItem()) {
    keyEvent.preventDefault();
    return runAction('trash');
  }
  if (withCommand && commandShortcuts[keyEvent.key]) {
    keyEvent.preventDefault();
    return commandShortcuts[keyEvent.key]();
  }
  if (withCommand && keyEvent.key >= '1' && keyEvent.key <= '4' && panes[keyEvent.key - 1]) {
    keyEvent.preventDefault();
    return setActivePane(keyEvent.key - 1);
  }
  if (keyEvent.key === '/' && !inSearch) {
    keyEvent.preventDefault();
    return queryOne('#search-input').focus();
  }
  if (keyEvent.key === 'ArrowDown' || keyEvent.key === 'ArrowUp') {
    keyEvent.preventDefault();
    return moveListSelection(keyEvent.key === 'ArrowDown' ? 1 : -1);
  }
  if (keyEvent.key === 'Enter' && activeItem() && !inSearch) runAction('open');
});

window.api.onLibraryChanged(loadLibrary);
window.api.onZoom(zoomActivePane);
window.api.onToggleZen(toggleZen);
window.api.onToggleMini(toggleMini);
window.api.onOpenPalette(openPalette);
addPane();
applyLayout();
loadLibrary();
</script>
</body>
</html>
